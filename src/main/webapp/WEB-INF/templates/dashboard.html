<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Asset Registry System</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 40px; background-color: #f8f9fa; }
        .container { max-width: 700px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .budget-card { background-color: #e2f0d9; padding: 15px; border-left: 5px solid #385723; margin-bottom: 20px; font-size: 1.2em; }
        .error-badge { background-color: #fce4d6; color: #c00000; padding: 12px; border-left: 5px solid #c00000; margin-bottom: 20px; font-weight: bold; }
        input { width: 100%; padding: 10px; margin: 10px 0 20px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; width: 100%; font-weight: bold; }
        button:hover { background-color: #218838; }
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th, td { padding: 12px; border: 1px solid #dee2e6; text-align: left; }
        th { background-color: #f1f3f5; }
    </style>
</head>
<body>

<div class="container">
    <h2>Institutional Asset Registry</h2>

    <div class="budget-card">
        Available Procurement Funds: <strong>$<span th:text="${budget}">5000.00</span></strong>
    </div>

    <div class="error-badge" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form action="register-asset" method="POST">
        <label>Asset Description Name:</label>
        <input type="text" name="assetName" placeholder="e.g. Dell Monitor 24" required />

        <label>Unit Acquisition Cost ($):</label>
        <input type="number" step="0.01" name="assetCost" placeholder="e.g. 299.99" required />

        <button type="submit">Verify Budget & Deploy Asset</button>
    </form>

    <h3>Asset Logs Registry</h3>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Asset Name</th>
            <th>Cost</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="asset : ${assets}">
            <td th:text="${asset.id}">1</td>
            <td th:text="${asset.name}">Asset</td>
            <td>$<span th:text="${asset.cost}">0.00</span></td>
        </tr>
        <tr th:if="${#lists.isEmpty(assets)}">
            <td colspan="3" style="text-align: center; color: #777;">No assets registered yet.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
